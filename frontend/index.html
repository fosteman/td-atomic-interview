<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic FX Trading</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: monospace; font-size: 14px; background: #0a0e27; color: #e0e0e0; padding: 20px; }
      .container { max-width: 1200px; margin: 0 auto; }
      h1, h2 { margin: 20px 0 10px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
      .panel { border: 1px solid #444; padding: 15px; background: #111; }
      input, select, button { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 8px; margin: 5px 0; font-family: monospace; }
      button { cursor: pointer; background: #1a5f3f; }
      button:hover { background: #2a7f5f; }
      table { width: 100%; border-collapse: collapse; margin: 10px 0; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
      .status-submitted { color: #ffa500; }
      .status-accepted { color: #90ee90; }
      .status-settled { color: #87ceeb; }
      .error { color: #ff6b6b; }
      .success { color: #51cf66; }
      .rate { font-size: 24px; font-weight: bold; color: #ffd700; }
      #ws-status { font-size: 12px; padding: 5px; border-radius: 3px; display: inline-block; }
      .ws-connected { background: #1a5f3f; }
      .ws-disconnected { background: #5f1a1a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
