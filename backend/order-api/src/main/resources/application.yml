spring:
  application:
    name: order-api
  datasource:
    url: jdbc:postgresql://localhost:5432/atomicfx
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.atomicfx: DEBUG
