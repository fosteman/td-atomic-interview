version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: atomicfx-postgres
    environment:
      POSTGRES_DB: atomicfx
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: atomicfx-solace
    shm_size: 1g
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
    ports:
      - "8008:8008"      # Web UI
      - "55555:55555"     # SMF
      - "8080:8080"       # REST API
      - "1883:1883"       # MQTT
      - "8883:8883"       # AMQP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/api/v2/monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
